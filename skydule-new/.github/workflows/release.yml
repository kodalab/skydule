name: Release bundle

# Builds the signed Android App Bundle (.aab) to upload to Google Play.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The upload key lives only in GitHub Actions secrets (see docs/RELEASING.md), never in the repo.
      - name: Restore upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Missing UPLOAD_KEYSTORE_BASE64 secret. See docs/RELEASING.md."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$UPLOAD_STORE_PASSWORD"
            echo "keyAlias=$UPLOAD_KEY_ALIAS"
            echo "keyPassword=$UPLOAD_KEY_PASSWORD"
          } > keystore.properties

      # Optional: crash reporting config, written from a secret so it never lives in the repo.
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON_BASE64 secret: building without crash reporting."
          fi

      - name: Test and build signed bundle
        env:
          # Optional: Google Places key for location suggestions (empty = OpenStreetMap only).
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
        run: ./gradlew testDebugUnitTest bundleRelease -PversionCode=$(( ${{ github.run_number }} + 100 )) --stacktrace

      - name: Remove signing files
        if: always()
        run: rm -f keystore.properties app/google-services.json "$RUNNER_TEMP/upload.jks"

      # Downloadable from the run page by people who can see the repo. It is signed with the upload key only,
      # which Google re-signs, so it isn't useful to anyone else.
      - uses: actions/upload-artifact@v4
        with:
          name: skydule-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
