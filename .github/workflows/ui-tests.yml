name: UI tests

# Runs the on-emulator journey tests (app/src/androidTest) against a real Android emulator.
# Slower than the unit tests, so it is separate from "Build APK". Start it by hand from the Actions tab at any time.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Also once a week even with no pushes, to catch drift (a new emulator image, a changed dependency).
  schedule:
    - cron: "17 5 * * 1"

# A newer push replaces a run still in progress for the same branch, which saves build minutes.
concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The emulator needs hardware acceleration; GitHub's Linux runners support it once /dev/kvm is opened up.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Two runs: the first-launch test needs a freshly installed app with no permissions, and each connected run
          # installs the app fresh and removes it afterwards.
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.kodalabs.skydule.LaunchWithoutPermissionTest
            ./gradlew connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.notClass=com.kodalabs.skydule.LaunchWithoutPermissionTest

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
