name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to update the rolling "latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: gradule-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # On main, also publish the APK to a rolling "latest" release so you can
      # install it straight from your phone's browser.
      - name: Move 'latest' tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest debug build
          prerelease: true
          body: Automatic debug build of the latest commit on main.
          files: app/build/outputs/apk/debug/app-debug.apk
